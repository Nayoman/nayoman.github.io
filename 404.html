<title>Un momento…</title>
<script>
// Página «recogedora»: GitHub la sirve para cualquier dirección de nayoman.github.io que no exista.
// Incidente 10-oct-2026: al renombrar «la-pizarra» a «mc-coach» (GY-D27) los enlaces y QR ya enviados
// al gimnasio daban 404, y la dirección escrita con mayúsculas (…/MC-COACH/) también.
// Aquí se arregla la dirección (nombre viejo → nuevo, mayúsculas → minúsculas) conservando el resto
// (tele.html, yo.html?s=código). Si no hay nada que arreglar no se redirige: así nunca entra en bucle.
(function () {
  var antes = location.pathname;
  var ahora = antes.toLowerCase().replace(/^\/la-pizarra(\/|$)/, '/mc-coach/');
  if (ahora !== antes) location.replace(ahora + location.search + location.hash);
  else document.documentElement.className = 'no';
})();
</script>
<style>
html { background: #0a0a0a; color: #f5f5f7; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; text-align: center; }
p { display: none; max-width: 28em; }
